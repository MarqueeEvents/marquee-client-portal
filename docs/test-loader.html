<!-- Marquee portal TEST loader (paste into DJEP > Website Tools > Client Portal > Appearance > "Marquee Test" style > Custom Scripting Code).
     Always loads the newest commit on the initial-scaffold branch (looked up on GitHub, remembered for 5 minutes),
     so test clients see updates within minutes without a hard refresh. Falls back to the branch link if GitHub is unreachable.
     For launch, replace with fixed @main links (see djep-install.md). -->
<script>(function(){var R='MarqueeEvents/marquee-client-portal',B='initial-scaffold',K='mq-sha',now=Date.now();function go(v){var b='https://cdn.jsdelivr.net/gh/'+R+'@'+v+'/';var l=document.createElement('link');l.rel='stylesheet';l.href=b+'styles/portal.css';document.head.appendChild(l);var s=document.createElement('script');s.src=b+'dist/marquee-portal.js';(document.body||document.head).appendChild(s);}try{var c=JSON.parse(sessionStorage.getItem(K)||'null');if(c&&now-c.t<300000)return go(c.v);}catch(e){}fetch('https://api.github.com/repos/'+R+'/commits/'+B,{headers:{Accept:'application/vnd.github.sha'}}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(v){v=v.trim();try{sessionStorage.setItem(K,JSON.stringify({v:v,t:now}));}catch(e){}go(v);}).catch(function(){go(B);});})();</script>
